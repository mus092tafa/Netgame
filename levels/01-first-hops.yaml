id: 01-first-hops
title: First hops
brief: >
  Your laptop is on the office network. The database lives on a separate backend network
  that your laptop can't reach directly. web-01 sits in both networks.
  Work through the goals in the top right of the map: the next one is drawn as a dotted line.
  Each goal shows a command that does it. Press "What does it mean?" to see what every part of the command is for.

networks:
  - id: office
    name: office
    subnet: 10.10.0.0/24
  - id: backend
    name: backend
    subnet: 10.20.0.0/24

machines:
  - id: laptop
    kind: laptop
    user: dev
    terminal: true
    networks: { office: 10.10.0.10 }

  - id: dns
    kind: dns
    user: root
    networks: { office: 10.10.0.53 }
    services:
      - { name: dnsmasq, port: 53, transport: udp }
      - { name: dnsmasq, port: 53 }

  - id: web-01
    kind: server
    user: dev
    networks: { office: 10.10.0.20, backend: 10.20.0.20 }
    services:
      - { name: sshd, port: 22 }
      - { name: nginx, port: 80 }
    firewall:
      drop: [443, 8443]   # simulator: these ports silently time out

  - id: db-01
    kind: database
    user: postgres
    networks: { backend: 10.20.0.30 }
    services:
      - { name: sshd, port: 22 }
      - { name: postgres, port: 5432 }

# Goals, in the order the panel suggests them. kind: connect (default) | ping | refused | timeout
target_connections:
  - from: laptop
    to: web-01
    kind: ping
    label: "Check that web-01 is reachable"
    command: ping -c 2 web-01
  - from: laptop
    to: web-01
    port: 80
    label: "Fetch web-01's home page"
    command: curl http://web-01/
  - from: laptop
    to: web-01
    port: 8080
    kind: refused
    label: "Knock on a port where nothing listens"
    command: curl http://web-01:8080/
  - from: laptop
    to: web-01
    port: 443
    kind: timeout
    label: "Find the port web-01's firewall blocks"
    command: curl -m 3 https://web-01/
  - from: laptop
    to: web-01
    port: 22
    label: "SSH into web-01"
    command: ssh web-01
  - from: web-01
    to: db-01
    port: 5432
    label: "Connect to the database from web-01"
    command: psql -h db-01 -U app
  - from: web-01
    to: db-01
    port: 22
    label: "Hop on from web-01 to db-01"
    command: ssh db-01
